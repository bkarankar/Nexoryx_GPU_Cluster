apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: nexoryx-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        env:
        - name: OLLAMA_BASE_URL
          value: http://ollama-gpu:11434
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 20
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: nexoryx-gpu
spec:
  selector:
    app: open-webui
  ports:
  - port: 80
    targetPort: 8080
