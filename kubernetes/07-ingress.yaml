apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpu-ingress
  namespace: nexoryx-gpu
spec:
  ingressClassName: nginx
  rules:
  - host: gpu-ai.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              number: 80
